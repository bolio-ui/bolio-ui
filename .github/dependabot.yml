version: 2

updates:
  # Patch and minor updates arrive as one PR a week. A major update opens a PR
  # of its own, so it can be reviewed and reverted alone.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # eslint-plugin-react does not accept ESLint 10 yet
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # Babel 8 is ESM only, and a docs test loads @babel/core through Jest
      - dependency-name: "@babel/*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
